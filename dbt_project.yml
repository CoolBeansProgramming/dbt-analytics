
# Project name
name: 'bigquery_dbt_analytics'
version: '1.0.0'
config-version: 2

# Profile
profile: 'default'

# Directory configurations
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
models:
  bigquery_dbt_analytics:

    bronze:
      +schema: bronze
      +materialized: table

    silver:
      +schema: silver
      +materialized: table

    gold:
      +schema: gold
      +materialized: table

    example:
      +materialized: table
